name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    # For publishing test results as a check run and a PR comment.
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: builder
          load: true
          tags: bfg-builder:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Results are written as JUnit XML to a mounted directory so that they
      # survive the container.
      - name: Run tests
        run: |
          mkdir -p test-results
          docker run --rm -v "$PWD/test-results:/test-results" bfg-builder \
            sh -c "ldconfig && cd /src/bfg/build && ctest --output-on-failure --output-junit /test-results/ctest.xml -j\$(nproc)"

      - name: Publish test results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: test-results/**/*.xml
